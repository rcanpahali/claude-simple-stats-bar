<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="320" fill="#1e1e1e" />

  <text x="30" y="28" font-size="13" fill="#9d9d9d">Claude segment — anatomy</text>

  <!-- chips -->
  <rect x="30" y="44" width="180" height="36" rx="6" fill="#007acc" />
  <rect x="230" y="44" width="140" height="36" rx="6" fill="#007acc" />
  <rect x="390" y="44" width="150" height="36" rx="6" fill="#007acc" />
  <rect x="560" y="44" width="130" height="36" rx="6" fill="#007acc" />

  <text x="120" y="67" text-anchor="middle" font-size="13" fill="#ffffff">🤖 claude-sonnet-5</text>
  <text x="300" y="67" text-anchor="middle" font-size="13" fill="#ffffff">⚡ 2.4M tok</text>
  <text x="465" y="67" text-anchor="middle" font-size="13" fill="#ffffff">📊 38% ctx</text>
  <text x="625" y="67" text-anchor="middle" font-size="13" fill="#ffffff">💳 $0.842</text>

  <!-- leader lines -->
  <line x1="120" y1="80" x2="120" y2="112" stroke="#5a5a5a" stroke-width="1.5" />
  <line x1="300" y1="80" x2="300" y2="112" stroke="#5a5a5a" stroke-width="1.5" />
  <line x1="465" y1="80" x2="465" y2="112" stroke="#5a5a5a" stroke-width="1.5" />
  <line x1="625" y1="80" x2="625" y2="112" stroke="#5a5a5a" stroke-width="1.5" />
  <circle cx="120" cy="112" r="3" fill="#5a5a5a" />
  <circle cx="300" cy="112" r="3" fill="#5a5a5a" />
  <circle cx="465" cy="112" r="3" fill="#5a5a5a" />
  <circle cx="625" cy="112" r="3" fill="#5a5a5a" />

  <!-- labels -->
  <text x="120" y="136" text-anchor="middle" font-size="12.5" fill="#cccccc" font-weight="600">Model</text>
  <text x="120" y="154" text-anchor="middle" font-size="11.5" fill="#9d9d9d">icon changes color —</text>
  <text x="120" y="169" text-anchor="middle" font-size="11.5" fill="#9d9d9d">see below</text>

  <text x="300" y="136" text-anchor="middle" font-size="12.5" fill="#cccccc" font-weight="600">Total tokens</text>
  <text x="300" y="154" text-anchor="middle" font-size="11.5" fill="#9d9d9d">input + output</text>
  <text x="300" y="169" text-anchor="middle" font-size="11.5" fill="#9d9d9d">+ cache</text>

  <text x="465" y="136" text-anchor="middle" font-size="12.5" fill="#cccccc" font-weight="600">Context used</text>
  <text x="465" y="154" text-anchor="middle" font-size="11.5" fill="#9d9d9d">based on the</text>
  <text x="465" y="169" text-anchor="middle" font-size="11.5" fill="#9d9d9d">last turn only</text>

  <text x="625" y="136" text-anchor="middle" font-size="12.5" fill="#cccccc" font-weight="600">Estimated cost</text>
  <text x="625" y="154" text-anchor="middle" font-size="11.5" fill="#9d9d9d">bundled defaults,</text>
  <text x="625" y="169" text-anchor="middle" font-size="11.5" fill="#9d9d9d">or your pricing config</text>

  <!-- divider -->
  <line x1="30" y1="205" x2="690" y2="205" stroke="#3c3c3c" stroke-width="1" />

  <text x="30" y="230" font-size="13" fill="#9d9d9d">The 🤖 icon itself is a warning light for context usage:</text>

  <rect x="30" y="248" width="130" height="36" rx="6" fill="#2d2d2d" stroke="#3c3c3c" />
  <text x="95" y="271" text-anchor="middle" font-size="13" fill="#ffffff">🤖 &lt; 70%</text>

  <rect x="180" y="248" width="150" height="36" rx="6" fill="#2d2d2d" stroke="#3c3c3c" />
  <text x="255" y="271" text-anchor="middle" font-size="13" fill="#ffffff">⚠️ ≥ 70% used</text>

  <rect x="350" y="248" width="150" height="36" rx="6" fill="#2d2d2d" stroke="#3c3c3c" />
  <text x="425" y="271" text-anchor="middle" font-size="13" fill="#ffffff">🔥 ≥ 90% used</text>
</svg>
