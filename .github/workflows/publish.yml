name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package --githubBranch main

      - name: Locate .vsix
        id: vsix
        run: echo "path=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.path }}" -p "${{ secrets.VSCE_PAT }}"

      - name: Publish to Open VSX
        run: npx ovsx publish "${{ steps.vsix.outputs.path }}" -p "${{ secrets.OVSX_PAT }}"

      - name: Attach .vsix to GitHub Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.vsix.outputs.path }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.path }}
          path: ${{ steps.vsix.outputs.path }}
